name: Import verified Poly IA commission

on:
  push:
    branches: [main]
    paths: ['.commission-import/READY.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: polyia-commission-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Official actions/* v4 and v5 refs resolved on 2026-10-24.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct and verify the complete commission
        id: import
        run: python tools/github_import.py --stage-git
      - name: Commit the verified extracted files
        if: steps.import.outputs.imported == 'true'
        env:
          EXPECTED_SEED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$remote_head" != "$EXPECTED_SEED_SHA" ]]; then
            echo 'Main changed during import; refusing to overwrite concurrent work.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete verified Poly IA constitutional commission'
          git push origin HEAD:refs/heads/main
